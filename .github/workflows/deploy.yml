name: Deploy to GitHub Pages

# Runs when release-please dispatches it at a new release tag (see release-please.yml),
# when a v* tag is pushed manually (fallback), or on manual workflow_dispatch.
# The GitHub Release itself is created by release-please, not this workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Validate examples
        run: uv run python tools/validate-examples.py

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Vue app
        run: |
          # Build Vue app with relative paths for custom domain deployment
          npm run build

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Python dependencies
        run: uv sync

      - name: Generate reference documentation
        run: uv run python tools/generate-reference.py

      - name: Build MkDocs
        run: |
          # Update site_url for custom domain deployment
          # Use sed to update site_url without parsing custom YAML tags
          sed 's|site_url: https://w3id.org/aac/|site_url: https://aac.slolab.ai/docs/|' mkdocs.yml > mkdocs.yml.tmp
          uv run python -m mkdocs build --quiet --config-file mkdocs.yml.tmp
          rm -f mkdocs.yml.tmp

      - name: Prepare schema artifacts
        run: |
          mkdir -p site/schema site/examples
          uv run python tools/publish-schemas.py

      - name: Copy examples
        run: |
          cp schema/examples/*.json site/examples/ 2>/dev/null || true

      - name: Combine builds
        run: |
          # Vue app is built to dist/ with relative paths
          # Add docs to the dist folder
          mkdir -p dist/docs
          cp -r site/* dist/docs/
          # Add CNAME file for custom domain
          # This tells GitHub Pages to serve at aac.slolab.ai
          # and redirect github.io URLs to the custom domain
          echo "aac.slolab.ai" > dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
